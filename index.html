<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pool Familial">
  <title>Calendrier Combiné LNH & NFL 2026-2027</title>
  
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-red: #f43f5e;
      --accent-gold: #fbbf24;
      --accent-green: #22c55e;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px; min-height: 100vh; }

    header { margin-bottom: 20px; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 800; }
    .status-bar { font-size: 0.75rem; color: var(--accent-green); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .pulse { width: 8px; height: 8px; background-color: var(--accent-green); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--accent-green); }

    /* LEADERBOARD */
    .section-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .leaderboard { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .leader-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .leader-name { font-weight: 700; font-size: 1rem; }
    .leader-teams { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .leader-team-item { display: flex; align-items: center; gap: 4px; text-decoration: none; color: inherit; }
    .leader-team-item:hover { text-decoration: underline; color: var(--accent-blue); }
    .leader-team-logo { width: 18px; height: 18px; object-fit: contain; }
    .leader-score { font-size: 1.4rem; font-weight: 800; color: var(--accent-gold); text-align: right; }

    /* CONTROLS & FILTERS */
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); font-size: 0.95rem; outline: none; }
    .filter-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-btn { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background-color: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

    /* GAME CARDS */
    .games-list { display: flex; flex-direction: column; gap: 10px; }
    .game-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .game-card.habs-card { border-left: 4px solid var(--accent-red); }
    .game-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; font-weight: 700; }
    .badge { padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .badge-nfl { background-color: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }
    .badge-lnh { background-color: rgba(244, 63, 94, 0.15); color: var(--accent-red); }
    .badge-owner { background-color: rgba(251, 191, 36, 0.15); color: var(--accent-gold); margin-left: 4px; }
    .live-tag { background-color: var(--accent-red); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; }

    .game-body { display: flex; justify-content: space-between; align-items: center; font-size: 0.92rem; font-weight: 600; padding: 4px 0; }
    .team { display: flex; align-items: center; gap: 8px; width: 42%; }
    .team.away { justify-content: flex-start; text-align: left; }
    .team.home { justify-content: flex-end; text-align: right; flex-row-reverse: row-reverse; }
    .team-logo { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
    .team-info { display: flex; flex-direction: column; }
    .team-link { color: var(--text-main); text-decoration: none; transition: color 0.2s; }
    .team-link:hover { color: var(--accent-blue); text-decoration: underline; }
    .score { font-size: 1.25rem; font-weight: 800; color: var(--accent-gold); }
    .vs { color: var(--text-muted); font-size: 0.75rem; }

    .game-footer { border-top: 1px dashed var(--border-color); padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
    .channel { color: var(--accent-gold); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Calendrier Combiné 2026-2027</h1>
    <div class="status-bar"><span class="pulse"></span> Résultats en direct synchronisés</div>
  </header>

  <section>
    <div class="section-title">Tableau des Meneurs Pool NFL</div>
    <div class="leaderboard" id="leaderboard"></div>
  </section>

  <section class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Rechercher une équipe, un adversaire ou une date...">
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">Tous les matchs</button>
      <button class="filter-btn" onclick="setFilter('Martin', this)">Martin</button>
      <button class="filter-btn" onclick="setFilter('Véronique', this)">Véronique</button>
      <button class="filter-btn" onclick="setFilter('Raphaëlle', this)">Raphaëlle</button>
      <button class="filter-btn" onclick="setFilter('Canadiens', this)">Canadiens (82 matchs)</button>
    </div>
  </section>

  <main class="games-list" id="gamesContainer"></main>

  <script>
    // CORRESPONDANCE DES ÉQUIPES VERS LEURS PAGES OFFICIELLES DE JOUEURS & STATISTIQUES (ESPN)
    const teamLinks = {
      "Los Angeles Rams": "https://www.espn.com/nfl/team/roster/_/name/lar/los-angeles-rams",
      "Buffalo Bills": "https://www.espn.com/nfl/team/roster/_/name/buf/buffalo-bills",
      "Baltimore Ravens": "https://www.espn.com/nfl/team/roster/_/name/bal/baltimore-ravens",
      "Seattle Seahawks": "https://www.espn.com/nfl/team/roster/_/name/sea/seattle-seahawks",
      "Cleveland Browns": "https://www.espn.com/nfl/team/roster/_/name/cle/cleveland-browns",
      "Jacksonville Jaguars": "https://www.espn.com/nfl/team/roster/_/name/jax/jacksonville-jaguars",
      "Detroit Lions": "https://www.espn.com/nfl/team/roster/_/name/det/detroit-lions",
      "Arizona Cardinals": "https://www.espn.com/nfl/team/roster/_/name/ari/arizona-cardinals",
      "Kansas City Chiefs": "https://www.espn.com/nfl/team/roster/_/name/kc/kansas-city-chiefs",
      "Dallas Cowboys": "https://www.espn.com/nfl/team/roster/_/name/dal/dallas-cowboys",
      "Montreal Canadiens": "https://www.espn.com/nhl/team/roster/_/name/mtl/montreal-canadiens",
      "Canadiens de Montréal": "https://www.espn.com/nhl/team/roster/_/name/mtl/montreal-canadiens"
    };

    function getStatsUrl(teamName, league) {
      for (const [name, url] of Object.entries(teamLinks)) {
        if (teamName.toLowerCase().includes(name.toLowerCase())) return url;
      }
      const sport = league === 'LNH' ? 'nhl' : 'nfl';
      return `https://www.espn.com/${sport}/teams`;
    }

    // 1. CONFIGURATION DES ÉQUIPES DU POOL (NFL)
    const members = {
      "Martin": { 
        teams: ["Los Angeles Rams", "Buffalo Bills", "Baltimore Ravens", "Seattle Seahawks"],
        logos: [
          "https://a.espncdn.com/i/teamlogos/nfl/500/lar.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/buf.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/bal.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/sea.png"
        ]
      },
      "Véronique": { 
        teams: ["Cleveland Browns", "Jacksonville Jaguars", "Detroit Lions", "Arizona Cardinals"],
        logos: [
          "https://a.espncdn.com/i/teamlogos/nfl/500/cle.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/jax.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/det.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/ari.png"
        ]
      },
      "Raphaëlle": { 
        teams: ["Buffalo Bills", "Kansas City Chiefs", "Los Angeles Rams", "Dallas Cowboys"],
        logos: [
          "https://a.espncdn.com/i/teamlogos/nfl/500/buf.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/kc.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/lar.png",
          "https://a.espncdn.com/i/teamlogos/nfl/500/dal.png"
        ]
      }
    };

    let allGames = [];
    let currentFilter = 'all';

    function getTeamOwners(teamName) {
      const owners = [];
      for (const [owner, data] of Object.entries(members)) {
        if (data.teams.some(t => teamName.toLowerCase().includes(t.toLowerCase()))) {
          owners.push(owner);
        }
      }
      return owners;
    }

    // 2. RÉCUPÉRATION ET EXTRACTION DES DONNÉES
    async function fetchLiveSchedules() {
      try {
        const nflRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260901-20270120&limit=500');
        const nflData = await nflRes.json();
        
        const nhlRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/mtl/schedule?season=2027');
        const nhlData = await nhlRes.json();

        const parseEvent = (event, league) => {
          const competition = event.competitions ? event.competitions[0] : event;
          const home = competition.competitors.find(c => c.homeAway === 'home');
          const away = competition.competitors.find(c => c.homeAway === 'away');
          const rawDate = new Date(event.date);

          return {
            id: event.id,
            league: league,
            rawDate: rawDate,
            dateStr: rawDate.toLocaleDateString('fr-CA', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            homeTeam: home.team.displayName,
            homeLogo: home.team.logo || 'https://a.espncdn.com/i/teamlogos/default-team-logo.png',
            awayTeam: away.team.displayName,
            awayLogo: away.team.logo || 'https://a.espncdn.com/i/teamlogos/default-team-logo.png',
            homeScore: home.score?.value ?? home.score ?? '0',
            awayScore: away.score?.value ?? away.score ?? '0',
            status: event.status?.type?.state || 'pre',
            statusDetail: event.status?.type?.shortDetail || '',
            winner: event.status?.type?.state === 'post' ? (parseInt(home.score) > parseInt(away.score) ? home.team.displayName : away.team.displayName) : null,
            channel: competition.broadcasts?.[0]?.media?.shortName || (league === 'LNH' ? 'RDS / TVA Sports' : 'RDS / CBS / FOX')
          };
        };

        const nflGames = (nflData.events || []).map(e => parseEvent(e, 'NFL')).filter(g => getTeamOwners(g.homeTeam).length > 0 || getTeamOwners(g.awayTeam).length > 0);
        const habsGames = (nhlData.events || []).map(e => parseEvent(e, 'LNH'));

        allGames = [...nflGames, ...habsGames].sort((a, b) => a.rawDate - b.rawDate);

        renderLeaderboard();
        renderGames();
      } catch (err) {
        console.error("Erreur de synchronisation :", err);
      }
    }

    // 3. TABLEAU DES MENEURS AVEC LIENS VERS LES STATISTIQUES DES ÉQUIPES
    function renderLeaderboard() {
      const scores = { "Martin": 0, "Véronique": 0, "Raphaëlle": 0 };

      allGames.forEach(game => {
        if (game.league === 'NFL' && game.winner) {
          const owners = getTeamOwners(game.winner);
          owners.forEach(owner => {
            scores[owner] += 1;
          });
        }
      });

      const sortedMembers = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
      const leaderboardEl = document.getElementById('leaderboard');

      leaderboardEl.innerHTML = sortedMembers.map((name, rank) => `
        <div class="leader-card">
          <div>
            <div class="leader-name">${rank === 0 ? '👑 ' : ''}${name}</div>
            <div class="leader-teams">
              ${members[name].teams.map((team, idx) => `
                <a href="${getStatsUrl(team, 'NFL')}" target="_blank" class="leader-team-item" title="Voir les joueurs et stats de ${team}">
                  <img src="${members[name].logos[idx]}" class="leader-team-logo" alt="logo">
                </a>
              `).join('')}
            </div>
          </div>
          <div class="leader-score">${scores[name]} <span style="font-size:0.7rem; color:var(--text-muted)">PTS</span></div>
        </div>
      `).join('');
    }

    // 4. AFFICHAGE DES CARTES DE MATCHS AVEC LIENS CLIENTS/SERVEURS
    function renderGames(searchText = '') {
      const container = document.getElementById('gamesContainer');
      container.innerHTML = '';

      const filtered = allGames.filter(g => {
        const homeOwners = getTeamOwners(g.homeTeam);
        const awayOwners = getTeamOwners(g.awayTeam);
        const isHabs = g.homeTeam.includes("Canadiens") || g.awayTeam.includes("Canadiens");

        let matchesMember = true;
        if (currentFilter === 'Martin') matchesMember = homeOwners.includes('Martin') || awayOwners.includes('Martin');
        else if (currentFilter === 'Véronique') matchesMember = homeOwners.includes('Véronique') || awayOwners.includes('Véronique');
        else if (currentFilter === 'Raphaëlle') matchesMember = homeOwners.includes('Raphaëlle') || awayOwners.includes('Raphaëlle');
        else if (currentFilter === 'Canadiens') matchesMember = isHabs;

        const search = searchText.toLowerCase();
        const matchesSearch = searchText === '' || 
          g.homeTeam.toLowerCase().includes(search) || 
          g.awayTeam.toLowerCase().includes(search) || 
          g.dateStr.toLowerCase().includes(search);

        return matchesMember && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted)">Aucun match trouvé pour ce filtre</div>';
        return;
      }

      filtered.forEach(g => {
        const homeOwners = getTeamOwners(g.homeTeam);
        const awayOwners = getTeamOwners(g.awayTeam);
        const allMatchOwners = [...new Set([...homeOwners, ...awayOwners])];
        const isHabs = g.league === 'LNH';

        const card = document.createElement('div');
        card.className = `game-card ${isHabs ? 'habs-card' : ''}`;
        card.innerHTML = `
          <div class="game-header">
            <div>
              <span class="badge badge-${g.league.toLowerCase()}">${g.league}</span>
              ${allMatchOwners.map(owner => `<span class="badge badge-owner">${owner}</span>`).join('')}
            </div>
            ${g.status === 'in' ? `<span class="live-tag">EN DIRECT (${g.statusDetail})</span>` : `<span class="game-date">${g.dateStr}</span>`}
          </div>

          <div class="game-body">
            <div class="team away">
              <a href="${getStatsUrl(g.awayTeam, g.league)}" target="_blank">
                <img src="${g.awayLogo}" class="team-logo" alt="${g.awayTeam}">
              </a>
              <div class="team-info">
                <a href="${getStatsUrl(g.awayTeam, g.league)}" target="_blank" class="team-link">${g.awayTeam}</a>
                ${g.status !== 'pre' ? `<span class="score">${g.awayScore}</span>` : ''}
              </div>
            </div>
            <span class="vs">@</span>
            <div class="team home">
              <a href="${getStatsUrl(g.homeTeam, g.league)}" target="_blank">
                <img src="${g.homeLogo}" class="team-logo" alt="${g.homeTeam}">
              </a>
              <div class="team-info">
                <a href="${getStatsUrl(g.homeTeam, g.league)}" target="_blank" class="team-link">${g.homeTeam}</a>
                ${g.status !== 'pre' ? `<span class="score">${g.homeScore}</span>` : ''}
              </div>
            </div>
          </div>

          <div class="game-footer">
            <span>Diffusion : <strong class="channel">${g.channel}</strong></span>
            <span>${g.status === 'post' ? 'Terminé' : g.statusDetail}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames(document.getElementById('searchInput').value);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderGames(e.target.value);
    });

    fetchLiveSchedules();
    setInterval(fetchLiveSchedules, 60000);
  </script>
</body>
</html>
