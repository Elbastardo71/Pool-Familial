<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FanZone Pro - Application Complète</title>
  <!-- SDK Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #334155;
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    h2, h3 { color: #38bdf8; margin-top: 0; }
    input, button, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover { background: #0284c7; color: white; }
    .btn-secondary { background: #64748b; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .hidden { display: none !important; }
    .badge-godmode {
      background: #f59e0b;
      color: #0f172a;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 8px;
    }
    .qr-box {
      background: white;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 10px;
    }
    #log-message {
      color: #fbbf24;
      font-size: 0.85rem;
      margin-top: 10px;
      word-break: break-all;
    }
    .match-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 12px;
    }
    .score-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    .score-inputs input {
      width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1. ÉCRAN D'AUTHENTIFICATION (Caché une fois connecté) -->
  <div class="card" id="auth-card">
    <h2>⚡ FanZone Pro</h2>
    <p>Connexion / Inscription</p>
    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <input type="email" id="email" placeholder="Courriel">
    <input type="password" id="password" placeholder="Mot de passe (min 6 car.)">
    <button onclick="handleRegister()">S'inscrire</button>
    <button onclick="handleLogin()" class="btn-secondary">Se connecter</button>
    <div id="log-message"></div>
  </div>

  <!-- 2. TABLEAU DE BORD PRINCIPAL (Affiché après authentification) -->
  <div class="card hidden" id="dashboard-card">
    <h2>🏆 Tableau de bord FanZone Pro</h2>
    <div id="godmode-badge" class="badge-godmode hidden">👑 MODE GOD MODE ACTIF</div>
    <p id="user-info"></p>
    
    <hr style="border-color:#334155; margin:16px 0;">
    
    <!-- SECTION CREATION DE POOL -->
    <h3>Créer un pool privé</h3>
    <input type="text" id="pool-name" placeholder="Nom du pool (ex: Famille 2026)">
    <select id="sport-select">
      <option value="NFL">🏈 NFL Football</option>
      <option value="NHL">🏒 LNH Hockey</option>
      <option value="NBA">🏀 NBA Basketball</option>
      <option value="F1">🏎️ Formule 1</option>
    </select>
    <button onclick="createPool()">Créer mon Pool + QR Code</button>

    <div id="pool-result" class="hidden">
      <p style="color:#22c55e; font-weight:bold;">Pool créé avec succès !</p>
      <p>Code d'accès : <strong id="pool-code" style="color:#fbbf24;"></strong></p>
      <div class="qr-box">
        <img id="qr-img" src="" alt="QR Code" style="width:150px;">
      </div>
    </div>

    <hr style="border-color:#334155; margin:20px 0;">

    <!-- SECTION PRONOSTICS -->
    <h3>Faire mes pronostics</h3>
    <div class="match-card">
      <p style="margin:0; font-weight:bold;">Match à venir : Chiefs vs 49ers</p>
      <div class="score-inputs">
        <label>Chiefs</label>
        <input type="number" id="pred-home" min="0" value="24">
        <span>-</span>
        <input type="number" id="pred-away" min="0" value="20">
        <label>49ers</label>
      </div>
      <button onclick="savePrediction('game_001')" style="margin-top:10px;">Enregistrer le pronostic</button>
    </div>

    <button onclick="handleLogout()" class="btn-danger" style="margin-top:24px;">Déconnexion</button>
  </div>

  <script>
    // Configuration de votre projet Supabase
    const RAW_SUPABASE_URL = 'https://zwifukqufnitamolqmwd.supabase.co/rest/v1/';
    const SUPABASE_URL = RAW_SUPABASE_URL.replace(/\/rest\/v1\/?$/, '');
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3aWZ1a3F1Zm5pdGFtb2xxbXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzQ0MTQsImV4cCI6MjEwNDU1MDQxNH0.ZK4WM64AyHK7HgrLo1HmVutUYZInP1fg_hsCY4PWdeo';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let activePoolId = null;

    function showLog(msg, isError = false) {
      const logEl = document.getElementById('log-message');
      logEl.style.color = isError ? '#ef4444' : '#fbbf24';
      logEl.innerText = msg;
    }

    // INSCRIPTION
    async function handleRegister() {
      showLog("Inscription en cours...");
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value.trim();

      if (!email || !password || !username) {
        showLog("Veuillez remplir tous les champs.", true);
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        showLog("Erreur inscription : " + error.message, true);
      } else {
        showLog("Compte créé ! Connexion...");
        checkSession();
      }
    }

    // CONNEXION
    async function handleLogin() {
      showLog("Connexion en cours...");
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showLog("Entrez votre courriel et mot de passe.", true);
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showLog("Erreur connexion : " + error.message, true);
      } else {
        checkSession();
      }
    }

    // VERIFICATION DE SESSION ET ROLES
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        document.getElementById('auth-card').classList.add('hidden');
        document.getElementById('dashboard-card').classList.remove('hidden');
        document.getElementById('user-info').innerText = "Connecté en tant que : " + session.user.email;

        // Vérification des privilèges God Mode
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .single();

        if (profile && profile.role === 'GOD_MODE') {
          document.getElementById('godmode-badge').classList.remove('hidden');
        }
      }
    }

    // CREATION DE POOL + QR CODE
    async function createPool() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const name = document.getElementById('pool-name').value;
      const sport_id = document.getElementById('sport-select').value;

      if (!name) {
        alert("Veuillez donner un nom à votre pool.");
        return;
      }

      const join_code = Math.random().toString(36).substring(2, 8).toUpperCase();

      const { data, error } = await supabaseClient
        .from('private_pools')
        .insert([{ admin_id: session.user.id, name, sport_id, join_code }])
        .select();

      if (error) {
        alert("Erreur de création : " + error.message);
      } else {
        activePoolId = data[0].id;
        document.getElementById('pool-result').classList.remove('hidden');
        document.getElementById('pool-code').innerText = join_code;
        
        const joinUrl = window.location.origin + '?join=' + join_code;
        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;
      }
    }

    // ENREGISTREMENT DES PRONOSTICS
    async function savePrediction(gameId) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const homeScore = parseInt(document.getElementById('pred-home').value, 10);
      const awayScore = parseInt(document.getElementById('pred-away').value, 10);

      if (!activePoolId) {
        alert("Veuillez d'abord créer ou rejoindre un pool.");
        return;
      }

      const { error } = await supabaseClient
        .from('predictions')
        .upsert([{
          pool_id: activePoolId,
          user_id: session.user.id,
          game_id: gameId,
          home_score_pred: homeScore,
          away_score_pred: awayScore
        }], { onConflict: 'pool_id,user_id,game_id' });

      if (error) {
        alert("Erreur lors de l'enregistrement : " + error.message);
      } else {
        alert("Pronostic enregistré avec succès ! 🏈");
      }
    }

    // DECONNEXION
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    // Démarrage de l'application
    checkSession();
  </script>
</body>
</html>
